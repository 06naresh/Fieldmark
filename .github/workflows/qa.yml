name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend and frontend quality gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldmark_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldmark_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      SECRET_KEY: ci-only-secret-key-at-least-32-characters-long
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fieldmark_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fieldmark_db
      FRONTEND_ORIGINS: http://localhost:4173,http://localhost:5173
      E2E_BACKEND_PYTHON: python
      E2E_BACKEND_PORT: 8000
      E2E_FRONTEND_ORIGIN: http://localhost:4173
      E2E_API_BASE_URL: http://localhost:8000/api/v1
      E2E_ADMIN_EMAIL: admin.e2e@fieldmark.test
      E2E_ADMIN_PASSWORD: FieldmarkE2E!23
      VITE_API_BASE_URL: http://localhost:8000/api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check backend syntax
        working-directory: backend
        run: python -m compileall -q app scripts

      - name: Apply migrations to QA database
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Alembic migration check
        working-directory: backend
        run: python -m alembic check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend type checks and lint
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run typecheck:e2e
          npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
